version: 2

updates:
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly
    groups:
      backward-compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: nuget
    directory: /src/DeveloperToolbox.Example/DeveloperToolbox.Example.Tests
    schedule:
      interval: monthly
    groups:
      backward-compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /src/DeveloperToolbox.Example/DeveloperToolbox.Example.Client
    schedule:
      interval: monthly
    groups:
      backward-compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
