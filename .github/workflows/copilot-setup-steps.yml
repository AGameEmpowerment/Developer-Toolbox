name: "Copilot Setup Steps"

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - uses: actions/setup-dotnet@v5
              with:
                dotnet-version: |
                    8.x
                    9.x
                    10.x

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '24.x'

            - name: npm install
              run: npm ci

            - name: dotnet restore
              run: dotnet restore
