# This workflow validates checked-in local-toolbox templates; it does not deploy.
name: AI Asset Synchronization

on:
  pull_request:
    paths:
      - '.ai/**'
      - '.agents/skills/**'
      - '.claude/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/ai-assets-sync.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'sync_ai_assets.ps1'
  push:
    paths:
      - '.ai/**'
      - '.agents/skills/**'
      - '.claude/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/ai-assets-sync.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'sync_ai_assets.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-generated-adapters:
    name: Verify Generated Adapters
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Regenerate host adapters
        shell: pwsh
        run: ./sync_ai_assets.ps1

      - name: Validate canonical assets and generated coverage
        shell: pwsh
        run: python ./tests/test_ai_assets.py

      - name: Fail when generated assets are stale
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
              $changes
              git diff
              throw 'Generated AI assets are out of sync. Edit canonical sources and run sync_ai_assets.ps1.'
          }
