# Shared common development resources
# These resources are intended for development and testing purposes only.
# Infrastructure resources only; examples run independently against these endpoints.
# All services start with an explicit setup/up command. Long-running services use
# unless-stopped so a developer's manual stop survives engine or machine restarts.
# Initialization jobs use no restart policy and complete once per explicit startup.

# Keep independent service network namespaces with either Compose provider.
# A shared Podman pod would make Service Bus and RabbitMQ collide on port 5672.
x-podman:
    in_pod: false

services:
    # Local Redis Cache Instance
    redis:
        image: docker.io/library/redis:latest
        pull_policy: never
        command:
            [
                "redis-server",
                "--appendonly",
                "yes",
                "--notify-keyspace-events",
                "AKE",
            ]
        ports:
            - "127.0.0.1:10120:6379" # Redis Cache Endpoint Port
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        volumes:
            - redis-data:/data
        restart: unless-stopped
        container_name: RedisCache

    # Local RedisInsight UI for Redis Cache
    redisinsight:
        image: docker.io/redis/redisinsight:latest
        pull_policy: never
        ports:
            - "127.0.0.1:10121:5540" # RedisInsight Web UI
        environment:
            RI_REDIS_HOST0: "redis"
            RI_REDIS_PORT0: "6379"
            RI_REDIS_DB0: "0"
            RI_REDIS_ALIAS0: "Local Redis Cache"
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5540/api/health/"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 20s
        volumes:
            - redisinsight-data:/data
        restart: unless-stopped
        container_name: RedisInsight

    # Local Mail Trap
    smtp4dev:
        image: docker.io/rnwood/smtp4dev:latest
        pull_policy: never
        ports:
            - "127.0.0.1:10130:25" # smtp server
            - "127.0.0.1:10131:110" # pop server
            - "127.0.0.1:10132:143" # imap server
            - "127.0.0.1:10140:80" # web ui
        volumes:
            - smtp4dev-data:/smtp4dev
        environment:
            # Container configuration (this binds within the container)
            - ServerOptions__Urls=http://*:80
            - ServerOptions__HostName=smtp4dev
        restart: unless-stopped
        container_name: Smtp4Dev

    # Local Seq observability service with OTLP ingestion and durable storage
    otlp-seq:
        image: docker.io/datalust/seq:latest
        pull_policy: never
        environment:
            ACCEPT_EULA: "${ACCEPT_EULA}"
            SEQ_FIRSTRUN_NOAUTHENTICATION: "${SEQ_FIRSTRUN_NOAUTHENTICATION}"
            SEQ_STORAGE_SECRETKEY: "${SEQ_STORAGE_SECRETKEY}"
        ports:
            - "127.0.0.1:10150:80" # Web UI and API port
        restart: unless-stopped
        container_name: SeqOtlp
        volumes:
            - seq-data:/data

    # Local API Mocking Service
    #
    # WireMock configured with HTTPS support using a custom JKS keystore.
    # Prerequisites: From the repo root, run ./containers/certs/Generate-WireMockCert.ps1 (or ./certs/Generate-WireMockCert.ps1 from the containers/ folder), or run docker_setup.ps1/docker_setup.sh to create the keystore before first use.
    # Ports:
    #   - 10080: HTTP (for backward compatibility)
    #   - 10443: HTTPS (TLS with custom certificate)
    # For client trust, import ./containers/certs/wiremock.crt (from the repo root) into your application's trust store.
    wiremock:
        image: docker.io/wiremock/wiremock:latest
        pull_policy: never
        ports:
            - "127.0.0.1:10080:8080" # WireMock HTTP Port for API routes
            - "127.0.0.1:10443:8443" # WireMock HTTPS Port for API routes
        volumes:
            - ./extensions:/var/wiremock/extensions:z
            - ./__files:/home/wiremock/__files:z
            - ./mappings:/home/wiremock/mappings:z
            - ./certs:/certs:ro,z
        command:
            - "--port"
            - "8080"
            - "--https-port"
            - "8443"
            - "--https-keystore"
            - "/certs/wiremock.jks"
            - "--keystore-password"
            - "${WIREMOCK_KEYSTORE_PASSWORD:-changeit}"
            - "--key-manager-password"
            - "${WIREMOCK_KEYSTORE_PASSWORD:-changeit}"
            - "--global-response-templating"
            - "--disable-gzip"
            - "--verbose"
        restart: unless-stopped
        container_name: Wiremock

networks:
    default:

volumes:
    smtp4dev-data:
        driver: local
    redis-data:
        driver: local
    redisinsight-data:
        driver: local
    seq-data:
        driver: local
