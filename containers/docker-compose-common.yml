# General project Development Resources / Team level configuration
# These resources are intended for development and testing purposes only.
# As needed update the exposed frontend port mappings from the container.

services:
    # Local SQL Server Instance
    #
    # Custom build from local Dockerfile in ./mssql.
    # Rationale: Allows for custom configuration, initialization scripts, or extensions not available in standard images.
    # Build context: ./mssql (see Dockerfile in that directory).
    # Environment variables:
    #   - SA_PASSWORD: SQL Server system administrator password (required)
    #   - ACCEPT_EULA: Must be set to "Y" to accept the license agreement (required)
    #   - MSSQL_AGENT_ENABLED: Enables SQL Server Agent (optional, default "true")
    # For more details on Dockerfile instructions, see: https://docs.docker.com/engine/reference/builder/
    mssql:
        build: ./mssql
        environment:
            MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
            SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
            ACCEPT_EULA: "${ACCEPT_EULA}"
            MSSQL_AGENT_ENABLED: "true"
        ports:
            - "127.0.0.1:10433:1433" # SQL Server Connection Port
        volumes:
            - mssql-data:/var/opt/mssql
        networks:
            default:
            sb-emulator:
                aliases:
                    - mssql
        restart: unless-stopped
        container_name: SqlServer
        hostname: mssql

    # CosmoDb Server Instance
    cosmosdb:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
        environment:
            # The current Microsoft guidance for the Linux emulator uses the
            # vnext-preview image. HTTPS keeps it compatible with the .NET SDK.
            PROTOCOL: "https"
            ENABLE_EXPLORER: "true"
        ports:
            - "127.0.0.1:10081:8081"
            - "127.0.0.1:10181:1234"
        volumes:
            - cosmos-data:/data
        healthcheck:
            test: ["CMD-SHELL", "curl --insecure --fail --silent https://127.0.0.1:8081/ >/dev/null || exit 1"]
            interval: 20s
            timeout: 10s
            retries: 15
            start_period: 60s
        container_name: CosmoDb
        restart: unless-stopped
        hostname: cosmosdb

    # Local Redis Cache Instance
    redis:
        image: redis:latest
        command:
            [
                "redis-server",
                "--appendonly",
                "yes",
                "--notify-keyspace-events",
                "AKE",
            ]
        ports:
            - "127.0.0.1:10120:6379" # Redis Cache Endpoint Port
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        volumes:
            - redis-data:/data
        restart: unless-stopped
        container_name: RedisCache

    # Local RedisInsight UI for Redis Cache
    redisinsight:
        image: redis/redisinsight:latest
        ports:
            - "127.0.0.1:10121:5540" # RedisInsight Web UI
        environment:
            RI_REDIS_HOST0: "redis"
            RI_REDIS_PORT0: "6379"
            RI_REDIS_DB0: "0"
            RI_REDIS_ALIAS0: "Local Redis Cache"
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5540/api/health/"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 20s
        volumes:
            - redisinsight-data:/data
        restart: unless-stopped
        container_name: RedisInsight

    # Local Mail Trap
    smtp4dev:
        image: rnwood/smtp4dev:latest
        ports:
            - "127.0.0.1:10130:25" # smtp server
            - "127.0.0.1:10131:110" # pop server
            - "127.0.0.1:10132:143" # imap server
            - "127.0.0.1:10140:80" # web ui
        volumes:
            - smtp4dev-data:/smtp4dev
        environment:
            # Container configuration (this binds within the container)
            - ServerOptions__Urls=http://*:80
            - ServerOptions__HostName=smtp4dev
        restart: unless-stopped
        container_name: Smtp4Dev

    # Local OpenTelemetry Collector with durable storage
    otel-collector:
        image: datalust/seq:latest
        environment:
            ACCEPT_EULA: "${ACCEPT_EULA}"
            SEQ_FIRSTRUN_NOAUTHENTICATION: "${SEQ_FIRSTRUN_NOAUTHENTICATION}"
            SEQ_STORAGE_SECRETKEY: "${SEQ_STORAGE_SECRETKEY}"
        ports:
            - "127.0.0.1:10150:80" # Web UI and API port
        restart: unless-stopped
        container_name: OtelCollector
        volumes:
            - seq-data:/data

    # Local API Mocking Service
    #
    # WireMock configured with HTTPS support using a custom JKS keystore.
    # Prerequisites: From the repo root, run ./containers/certs/Generate-WireMockCert.ps1 (or ./certs/Generate-WireMockCert.ps1 from the containers/ folder), or run docker_setup.ps1/docker_setup.sh to create the keystore before first use.
    # Ports:
    #   - 10080: HTTP (for backward compatibility)
    #   - 10443: HTTPS (TLS with custom certificate)
    # For client trust, import ./containers/certs/wiremock.crt (from the repo root) into your application's trust store.
    wiremock:
        image: wiremock/wiremock:latest
        ports:
            - "127.0.0.1:10080:8080" # WireMock HTTP Port for API routes
            - "127.0.0.1:10443:8443" # WireMock HTTPS Port for API routes
        volumes:
            - ./extensions:/var/wiremock/extensions
            - ./__files:/home/wiremock/__files
            - ./mappings:/home/wiremock/mappings
            - ./certs:/certs:ro
        command:
            - "--port"
            - "8080"
            - "--https-port"
            - "8443"
            - "--https-keystore"
            - "/certs/wiremock.jks"
            - "--keystore-password"
            - "${WIREMOCK_KEYSTORE_PASSWORD:-changeit}"
            - "--key-manager-password"
            - "${WIREMOCK_KEYSTORE_PASSWORD:-changeit}"
            - "--global-response-templating"
            - "--disable-gzip"
            - "--verbose"
        restart: unless-stopped
        container_name: Wiremock

    # Local Azure Blob Storage
    azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
            - "127.0.0.1:10000:10000" # Blob service
            - "127.0.0.1:10001:10001" # Queue service
            - "127.0.0.1:10002:10002" # Table service
        volumes:
            - azurite-data:/data
        restart: unless-stopped
        container_name: Azurite

    # Service Bus Emulator using the shared SQL Server Linux instance.
    service-bus:
        image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
        pull_policy: always
        volumes:
            - "./service-bus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
        ports:
            - "127.0.0.1:10170:5672" # Service Bus AMQP
            - "127.0.0.1:10171:5300" # Service Bus admin / management
        environment:
            SQL_SERVER: "mssql"
            MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}" # Password must match the SQL Server Linux container
            ACCEPT_EULA: "${ACCEPT_EULA}"
            SQL_WAIT_INTERVAL: "15" # Optional: Time in seconds to wait for SQL to be ready (default is 15 seconds)
        depends_on:
            - mssql
        networks:
            sb-emulator:
                aliases:
                    - sb-emulator
        restart: unless-stopped
        container_name: ServiceBus

networks:
    sb-emulator:

volumes:
    smtp4dev-data:
        driver: local
    redis-data:
        driver: local
    redisinsight-data:
        driver: local
    seq-data:
        driver: local
    cosmos-data:
        driver: local
    mssql-data:
        driver: local
    azurite-data:
        driver: local
